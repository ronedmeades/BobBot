<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bob Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    flex-shrink: 0;
  }

  .status-bar .left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-bar h1 {
    font-size: 16px;
    color: #58a6ff;
    font-weight: 600;
  }

  .status-bar .meta {
    font-size: 12px;
    color: #8b949e;
  }

  .status-bar .right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bot-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }

  .bot-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 6px #3fb950;
  }

  .bot-dot.offline {
    background: #f85149;
    box-shadow: 0 0 6px #f85149;
  }

  .btn {
    padding: 4px 12px;
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #21262d;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn:hover { background: #30363d; }
  .btn.danger { border-color: #f85149; color: #f85149; }
  .btn.danger:hover { background: #f8514922; }

  /* Main area */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* Activity feed */
  .activity {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 120px;
  }

  .resize-handle {
    width: 5px;
    cursor: col-resize;
    background: #30363d;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .resize-handle:hover,
  .resize-handle.dragging {
    background: #58a6ff;
  }

  .panel-header {
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    flex-shrink: 0;
  }

  .activity-feed {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .event {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
  }

  .event .time {
    color: #484f58;
    margin-right: 8px;
  }

  .event .tag {
    display: inline-block;
    padding: 0 5px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
  }

  .event.tool-call { background: #161b2288; }
  .event.tool-call .tag { background: #8957e5; color: #fff; }

  .event.tool-result { background: #161b2244; }
  .event.tool-result .tag { background: #30363d; color: #8b949e; }

  .event.message-in { background: #0d419d22; }
  .event.message-in .tag { background: #1f6feb; color: #fff; }

  .event.message-out { background: #23863622; }
  .event.message-out .tag { background: #238636; color: #fff; }

  .event.task-update { background: #9e6a0322; }
  .event.task-update .tag { background: #d29922; color: #0d1117; }

  .event.bot-status { background: #f8514922; }
  .event.bot-status .tag { background: #f85149; color: #fff; }

  .event.agent-status { background: #8957e522; }
  .event.agent-status .tag { background: #8957e5; color: #fff; }

  .event.a2a-request { background: #da3633aa; }
  .event.a2a-request .tag { background: #da3633; color: #fff; }

  .event.a2a-response { background: #23863622; }
  .event.a2a-response .tag { background: #238636; color: #fff; }

  .event.a2a-approval { background: #d2992222; }
  .event.a2a-approval .tag { background: #d29922; color: #0d1117; }

  .event.a2a-peer { background: #1f6feb22; }
  .event.a2a-peer .tag { background: #1f6feb; color: #fff; }

  /* Chat panel */
  .chat {
    width: 400px;
    min-width: 250px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: 90%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 6px;
    margin: 6px 0;
    cursor: pointer;
    display: block;
  }

  .msg.user {
    align-self: flex-end;
    background: #1f6feb;
    color: #fff;
    border-bottom-right-radius: 2px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: #21262d;
    border-bottom-left-radius: 2px;
  }

  .msg.thinking {
    align-self: flex-start;
    background: #21262d;
    color: #8b949e;
    font-style: italic;
  }

  .chat-input {
    display: flex;
    padding: 8px;
    gap: 8px;
    border-top: 1px solid #30363d;
    background: #161b22;
    flex-shrink: 0;
  }

  .chat-input textarea {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #0d1117;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    resize: vertical;
    min-height: 38px;
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.4;
  }

  .chat-input textarea:focus { border-color: #58a6ff; }

  .chat-input button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #238636;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .chat-input button:hover { background: #2ea043; }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Task bar */
  .task-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #161b22;
    border-top: 1px solid #30363d;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .task-bar .label {
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .task-bar .label.active {
    color: #d2a8ff;
  }

  .task-bar .label.done {
    color: #3fb950;
  }

  .task-bar .label .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d2a8ff;
    flex-shrink: 0;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .task-bar .label .done-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3fb950;
    flex-shrink: 0;
  }

  .task-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    white-space: nowrap;
    background: #21262d;
    border: 1px solid #30363d;
    cursor: default;
  }

  .task-chip .icon { font-size: 10px; }
  .task-chip.completed { border-color: #238636; color: #3fb950; }
  .task-chip.active { border-color: #d29922; color: #d29922; }
  .task-chip.pending { border-color: #8b949e; color: #8b949e; }
  .task-chip.paused { border-color: #8957e5; color: #d2a8ff; }
  .task-chip.failed { border-color: #f85149; color: #f85149; }
  .task-chip.cancelled { border-color: #484f58; color: #484f58; }

  .no-tasks {
    font-size: 12px;
    color: #484f58;
    font-style: italic;
  }

  .session-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    background: #8957e522;
    border: 1px solid #8957e5;
    color: #d2a8ff;
  }

  .session-status .pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d2a8ff;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .session-tools {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: #8b949e;
    white-space: nowrap;
  }

  .session-tools .tool-badge {
    padding: 2px 6px;
    border-radius: 8px;
    background: #21262d;
    border: 1px solid #30363d;
    font-size: 10px;
    color: #8b949e;
  }

  .session-divider {
    width: 1px;
    height: 16px;
    background: #30363d;
    flex-shrink: 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }
</style>
</head>
<body>

<div class="status-bar">
  <div class="left">
    <h1>Bob Dashboard</h1>
    <span class="meta" id="status-meta">loading...</span>
  </div>
  <div class="right">
    <div class="bot-indicator">
      <div class="bot-dot" id="bot-dot"></div>
      <span id="bot-label">Bot: ...</span>
    </div>
    <button class="btn" id="bot-toggle" onclick="toggleBot()">...</button>
  </div>
</div>

<div class="main">
  <div class="activity">
    <div class="panel-header">Activity Feed</div>
    <div class="activity-feed" id="activity-feed"></div>
  </div>
  <div class="resize-handle" id="resize-handle"></div>
  <div class="chat" id="chat-panel">
    <div class="panel-header">Chat with Bob</div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <textarea id="chat-input" placeholder="Message Bob... (Enter to send, Shift+Enter for new line)" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,200)+'px'"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<div class="task-bar">
  <span class="label" id="task-label">Idle</span>
  <div id="task-list"></div>
</div>

<script>
  let botRunning = false;

  // --- Auth ---
  let apiToken = localStorage.getItem('bob_api_token') || '';

  function getAuthHeaders() {
    const headers = {};
    if (apiToken) headers['Authorization'] = `Bearer ${apiToken}`;
    return headers;
  }

  function promptForToken() {
    // Token is injected server-side — if we still get 401, show a non-blocking message
    const chatEl = document.getElementById('messages');
    if (chatEl && !document.getElementById('auth-error-msg')) {
      const div = document.createElement('div');
      div.id = 'auth-error-msg';
      div.className = 'msg system';
      div.textContent = 'Authentication failed. Check that BOB_API_TOKEN is set in your .env and restart Bob.';
      chatEl.appendChild(div);
    }
  }

  async function authFetch(url, options = {}) {
    const headers = { ...getAuthHeaders(), ...(options.headers || {}) };
    const r = await fetch(url, { ...options, headers });
    if (r.status === 401) {
      promptForToken();
      throw new Error('Unauthorized');
    }
    return r;
  }

  // --- Status ---
  async function fetchStatus() {
    try {
      const r = await authFetch('/api/status');
      const s = await r.json();
      document.getElementById('status-meta').textContent =
        `${s.model} · uptime ${formatUptime(s.uptime)}`;
      botRunning = s.botRunning;
      updateBotUI();
    } catch {}
  }

  function formatUptime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  function updateBotUI() {
    const dot = document.getElementById('bot-dot');
    const label = document.getElementById('bot-label');
    const btn = document.getElementById('bot-toggle');

    if (botRunning) {
      dot.className = 'bot-dot';
      label.textContent = 'Bot: Online';
      btn.textContent = 'Stop';
      btn.className = 'btn danger';
    } else {
      dot.className = 'bot-dot offline';
      label.textContent = 'Bot: Offline';
      btn.textContent = 'Start';
      btn.className = 'btn';
    }
  }

  async function toggleBot() {
    const endpoint = botRunning ? '/api/bot/stop' : '/api/bot/start';
    try {
      await authFetch(endpoint, { method: 'POST' });
      botRunning = !botRunning;
      updateBotUI();
    } catch (e) {
      console.error('Bot toggle failed:', e);
    }
  }

  // --- Activity Feed (SSE) ---
  function connectSSE() {
    const sseUrl = apiToken ? `/api/events?token=${encodeURIComponent(apiToken)}` : '/api/events';
    const es = new EventSource(sseUrl);
    const feed = document.getElementById('activity-feed');

    es.onmessage = (e) => {
      const event = JSON.parse(e.data);
      appendEvent(feed, event);

      // Update bot status from events
      if (event.type === 'bot:status') {
        botRunning = event.data.running;
        updateBotUI();
      }

      // Update task list from events
      if (event.type === 'task:update') {
        fetchTasks();
        // Browser notification when a background task completes or fails
        if (event.data.status === 'completed' || event.data.status === 'failed') {
          const label = event.data.status === 'completed' ? 'Complete' : 'Failed';
          const desc = event.data.description || 'Background task';
          // Browser Notification API
          if (Notification.permission === 'granted') {
            new Notification('Bob - Task ' + label, { body: desc, icon: '/api/image?path=assets/bob-icon.ico' });
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission();
          }
          // Also inject a message into the chat so the user sees it
          addChatBubble('assistant', 'Background task ' + label.toLowerCase() + ': "' + desc + '"\n\nCheck the task panel or ask me for details.');
        }
      }

      // Capture user message as current task topic
      if (event.type === 'message:in') {
        setSessionTopic(event.data.text);
      }

      // Update task bar + thinking bubble from agent events
      if (event.type === 'agent:status') {
        updateAgentStatus(event.data);
        const bubble = document.getElementById('thinking-bubble');
        if (bubble && event.data.status !== 'done') {
          const labels = { thinking: 'Thinking...', tool_use: 'Working...' };
          bubble.textContent = event.data.detail || labels[event.data.status] || 'Working...';
        }
      }
      if (event.type === 'tool:call') {
        addToolToSession(event.data.tool);
        const bubble = document.getElementById('thinking-bubble');
        if (bubble) {
          bubble.textContent = `Using ${event.data.tool}...`;
        }
      }

      // A2A approval notifications
      if (event.type === 'a2a:approval' && event.data.status === 'pending') {
        addChatBubble('assistant', 'A2A request from "' + event.data.peerName + '": "' + (event.data.description || '') + '"\nUse approve_a2a_request or Telegram /approve to respond.');
      }

      // Background worker events
      if (event.type === 'worker:start' || event.type === 'worker:progress') {
        fetchTasks();
      }
      if (event.type === 'worker:idle') {
        fetchTasks();
      }
    };

    es.onerror = () => {
      // Reconnect after 3s
      es.close();
      setTimeout(connectSSE, 3000);
    };
  }

  function appendEvent(feed, event) {
    const div = document.createElement('div');
    const cls = event.type.replace(':', '-');
    div.className = `event ${cls}`;

    const time = new Date(event.timestamp).toLocaleTimeString();
    let body = '';

    switch (event.type) {
      case 'tool:call':
        body = `<span class="tag">TOOL</span>${event.data.tool}`;
        break;
      case 'tool:result': {
        const ok = event.data.success ? 'OK' : 'ERR';
        const preview = String(event.data.output || '').slice(0, 120);
        body = `<span class="tag">${ok}</span>${event.data.tool}: ${escapeHtml(preview)}`;
        break;
      }
      case 'message:in': {
        const src = event.data.source === 'dashboard' ? 'DASH' : 'TG';
        const preview = String(event.data.text || '').slice(0, 120);
        body = `<span class="tag">${src}</span>${escapeHtml(preview)}`;
        break;
      }
      case 'message:out': {
        const preview = String(event.data.text || '').slice(0, 120);
        body = `<span class="tag">BOB</span>${escapeHtml(preview)}`;
        break;
      }
      case 'task:update':
        body = `<span class="tag">${event.data.status.toUpperCase()}</span>${escapeHtml(event.data.description || '')}`;
        break;
      case 'agent:status': {
        const statusLabels = { thinking: 'THINKING', tool_use: 'WORKING', done: 'DONE' };
        const label = statusLabels[event.data.status] || event.data.status;
        body = `<span class="tag">${label}</span>${escapeHtml(event.data.detail || '')}`;
        break;
      }
      case 'bot:status':
        body = `<span class="tag">BOT</span>${event.data.running ? 'Started' : 'Stopped'}`;
        break;
      case 'a2a:request':
        body = `<span class="tag">A2A IN</span>${escapeHtml(event.data.peerName)} &rarr; ${event.data.method}`;
        break;
      case 'a2a:response':
        body = `<span class="tag">A2A OUT</span>${escapeHtml(event.data.taskId?.slice(0,8) || '')} (${event.data.state}) $${(event.data.costUsd || 0).toFixed(4)}`;
        break;
      case 'a2a:approval': {
        const aStatus = event.data.status === 'pending' ? 'PENDING' : event.data.status.toUpperCase();
        body = `<span class="tag">${aStatus}</span>${escapeHtml(event.data.peerName)}: ${escapeHtml(event.data.description || '')}`;
        break;
      }
      case 'a2a:peer':
        body = `<span class="tag">PEER</span>${escapeHtml(event.data.peerName)} &mdash; ${event.data.action}`;
        break;
      default:
        body = `<span class="tag">${event.type}</span>${JSON.stringify(event.data).slice(0, 100)}`;
    }

    div.innerHTML = `<span class="time">${time}</span>${body}`;
    feed.appendChild(div);

    // Auto-scroll
    feed.scrollTop = feed.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // --- Chat ---
  async function loadHistory() {
    try {
      const r = await authFetch('/api/history');
      const history = await r.json();
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      for (const entry of history) {
        addChatBubble(entry.role, entry.content);
      }
    } catch {}
  }

  function renderMessageContent(text) {
    // Parse image markers: ![alt](/api/image?path=...) and render as <img> tags
    const imagePattern = /!\[([^\]]*)\]\((\/api\/image\?path=[^)]+)\)/g;
    let result = '';
    let lastIndex = 0;
    let match;

    while ((match = imagePattern.exec(text)) !== null) {
      // Escape the text before this image
      if (match.index > lastIndex) {
        result += escapeHtml(text.slice(lastIndex, match.index));
      }

      const alt = escapeHtml(match[1]);
      let src = match[2];
      // Append auth token for the image request (img tags can't set headers)
      if (apiToken) {
        src += (src.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(apiToken);
      }

      result += '<img src="' + src + '" alt="' + alt + '" title="' + alt + '" '
        + 'onclick="window.open(this.src,\'_blank\')" '
        + 'onerror="this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<em>(image not found)</em>\')" />';

      lastIndex = match.index + match[0].length;
    }

    // Remaining text after last image
    if (lastIndex < text.length) {
      result += escapeHtml(text.slice(lastIndex));
    }

    return result;
  }

  function addChatBubble(role, text) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const displayText = text.length > 2000 ? text.slice(0, 2000) + '...' : text;

    if (role === 'assistant') {
      // Parse image markers in assistant messages
      div.innerHTML = renderMessageContent(displayText);
    } else {
      div.textContent = displayText;
    }

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    addChatBubble('user', text);

    const thinking = addChatBubble('thinking', 'Thinking...');
    thinking.id = 'thinking-bubble';
    const sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;
    input.disabled = true;

    try {
      const r = await authFetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await r.json();
      thinking.remove();

      if (data.error) {
        addChatBubble('assistant', `Error: ${data.error}`);
      } else {
        addChatBubble('assistant', data.text);
      }
    } catch (e) {
      thinking.remove();
      addChatBubble('assistant', `Error: ${e.message}`);
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  // --- Agent session tracking ---
  let agentSession = { status: null, detail: '', topic: '', tools: [], clearTimer: null };

  function setSessionTopic(messageText) {
    if (!messageText) return;
    // Truncate to a readable task label
    const text = String(messageText).trim();
    agentSession.topic = text.length > 60 ? text.slice(0, 57) + '...' : text;
    renderTaskBar();
  }

  function updateAgentStatus(data) {
    if (agentSession.clearTimer) {
      clearTimeout(agentSession.clearTimer);
      agentSession.clearTimer = null;
    }

    agentSession.status = data.status;
    agentSession.detail = data.detail || '';

    if (data.status === 'done') {
      // Keep the "done" state visible briefly, then clear
      agentSession.clearTimer = setTimeout(() => {
        agentSession.status = null;
        agentSession.detail = '';
        agentSession.topic = '';
        agentSession.tools = [];
        renderTaskBar();
      }, 8000);
    }

    renderTaskBar();
  }

  function addToolToSession(toolName) {
    if (!agentSession.tools.includes(toolName)) {
      agentSession.tools.push(toolName);
    }
    renderTaskBar();
  }

  // --- Tasks ---
  let lastTasks = [];

  async function fetchTasks() {
    try {
      const r = await authFetch('/api/tasks');
      lastTasks = await r.json();
      renderTaskBar();
    } catch {}
  }

  function renderTaskBar() {
    const label = document.getElementById('task-label');
    const container = document.getElementById('task-list');
    container.innerHTML = '';

    const hasSession = agentSession.status !== null;
    const hasTasks = lastTasks.length > 0;

    // Update the main label based on state
    if (hasSession && agentSession.status !== 'done') {
      const topic = agentSession.topic || 'Processing...';
      label.className = 'label active';
      label.innerHTML = `<span class="pulse-dot"></span>${escapeHtml(topic)}`;
    } else if (hasSession && agentSession.status === 'done') {
      const topic = agentSession.topic || 'Task complete';
      label.className = 'label done';
      label.innerHTML = `<span class="done-dot"></span>${escapeHtml(topic)}`;
    } else {
      label.className = 'label';
      label.textContent = 'Idle';
    }

    // Show step detail + tools as chips in the task-list area
    if (hasSession && agentSession.status !== 'done') {
      // Show current step
      const statusLabels = { thinking: 'Thinking...', tool_use: 'Working...' };
      const stepText = agentSession.detail || statusLabels[agentSession.status] || '';
      if (stepText) {
        const stepChip = document.createElement('span');
        stepChip.className = 'session-status';
        stepChip.innerHTML = `<span class="pulse"></span>${escapeHtml(stepText)}`;
        container.appendChild(stepChip);
      }
    }

    // Show tools used in this session
    if (hasSession && agentSession.tools.length > 0) {
      const toolsSpan = document.createElement('span');
      toolsSpan.className = 'session-tools';
      const recent = agentSession.tools.slice(-6);
      toolsSpan.innerHTML = recent.map(t =>
        `<span class="tool-badge">${escapeHtml(t)}</span>`
      ).join('');
      container.appendChild(toolsSpan);
    }

    // Show background tasks
    const activeTasks = lastTasks.filter(t => !['completed', 'cancelled', 'failed'].includes(t.status));
    const recentDone = lastTasks.filter(t => ['completed', 'cancelled', 'failed'].includes(t.status)).slice(-3);
    const tasksToShow = [...activeTasks, ...recentDone].slice(-8);

    if (tasksToShow.length > 0) {
      if (hasSession) {
        const divider = document.createElement('span');
        divider.className = 'session-divider';
        container.appendChild(divider);
      }

      const statusIcons = {
        completed: '\u2713',
        active: '\u25B6',
        pending: '\u25CB',
        paused: '\u275A\u275A',
        failed: '\u2717',
        cancelled: '\u2014',
      };

      for (const t of tasksToShow) {
        const chip = document.createElement('span');
        chip.className = `task-chip ${t.status}`;
        const progress = t.maxSteps ? ` (${t.stepsCompleted || 0}/${t.maxSteps})` : '';
        const priority = t.priority && t.priority !== 'normal' ? ` [${t.priority.toUpperCase()}]` : '';
        chip.title = `${t.description}\nStatus: ${t.status}${priority}\nProgress: ${t.stepsCompleted || 0}/${t.maxSteps || '?'} steps${t.findings ? '\n\nFindings: ' + t.findings.slice(0, 300) : ''}`;
        chip.innerHTML = `<span class="icon">${statusIcons[t.status] || '?'}</span>${t.description.slice(0, 35)}${progress}`;
        container.appendChild(chip);
      }
    }

    // If no session and no tasks at all, show idle with active task count
    if (!hasSession && activeTasks.length === 0 && !hasTasks) {
      // truly idle
    } else if (!hasSession && activeTasks.length > 0) {
      // Worker should be working on these — show in label
      const next = activeTasks[0];
      label.className = 'label active';
      label.innerHTML = `<span class="pulse-dot"></span>${escapeHtml(next.description.length > 50 ? next.description.slice(0, 47) + '...' : next.description)}`;
    }
  }

  // --- Resize handle ---
  (function() {
    const handle = document.getElementById('resize-handle');
    const chat = document.getElementById('chat-panel');
    let dragging = false;

    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      dragging = true;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const mainEl = document.querySelector('.main');
      const mainRect = mainEl.getBoundingClientRect();
      const newChatWidth = mainRect.right - e.clientX;
      const clamped = Math.max(250, Math.min(newChatWidth, mainRect.width - 120));
      chat.style.width = clamped + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  })();

  // --- Init ---
  fetchStatus();
  setInterval(fetchStatus, 10000);
  loadHistory();
  fetchTasks();
  connectSSE();

  // Request browser notification permission for task alerts
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
</script>

</body>
</html>
